---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      - name: Check lockfile is current
        run: uv lock --check

      - name: Install locked dependencies
        run: mise run sync

      - name: Run unit tests
        run: mise run test

      - name: Run end-to-end replay
        run: mise run replay

  build:
    name: Container Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Packaging gate: catches Dockerfile/lockfile breaks before merge. The
      # multi-arch signed build still happens on main via the release workflow.
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: costanza:ci
          platforms: linux/amd64

      # Run the image the way the cluster will: arbitrary uid 1032:100,
      # read-only rootfs, no HOME, only /data writable, config mounted ro.
      - name: Kubernetes-constraint smoke
        env:
          IMAGE: costanza:ci
          IMAGE_PREBUILT: "1"
        run: bash scripts/k8s-smoke.sh
